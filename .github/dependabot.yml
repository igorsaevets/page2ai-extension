version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A version is proposed only once it is a week old: a release pulled or found
    # malicious in its first days never reaches a PR. Security updates do not wait.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Every minor and patch update in one PR per run, instead of one PR per package.
    # Majors still come one by one: each needs its own check.
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: wxt
        update-types: [version-update:semver-major]
