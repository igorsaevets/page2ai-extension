name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Compile & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      # Node 24 strips the types, so the test imports lib/core/md-postprocess.ts as it ships (P2A-016).
      - name: Markdown post-processing unit test
        run: node scripts/md-postprocess.test.mjs

      # The same for lib/agent-bridge.ts, against a fake browser: which page the extractor may go into (T176).
      - name: Agent Bridge page-check unit test
        run: node scripts/agent-bridge.test.mjs

      - name: Build (Chrome MV3)
        run: npm run build
      # The agent script (BL-45 C): fails on an extension API, eval, a Trusted Types sink, a console call
      # or a new network call in the bundle (scripts/build-agent.mjs).
      - name: Build the agent script
        run: npm run build:agent
      # The same check the release jobs of publish-chrome.yml run before they hand the files on.
      - name: Check the agent build (checksums, the version and commit on line 1)
        run: bash scripts/release-agent.sh check .output/agent "$(jq -r .version package.json)+${GITHUB_SHA:0:7}"

  e2e:
    name: End-to-end (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # puppeteer-core drives a real browser instead of bundling one, which is
      # the point: the extractor runs inside an actual extension context, not a
      # DOM emulation that would not reproduce injection or the service worker.
      # @page2ai/mcp is the other end of the Agent Bridge suite: the published
      # server, so the test speaks the wire protocol users get (0.6: page2ai-bridge/2,
      # the key; the suite also plays a program that took port 3025 without it).
      - name: Install puppeteer-core and @page2ai/mcp
        run: npm i --no-save puppeteer-core @page2ai/mcp@0.6

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Build (e2e mode)
        run: npx wxt build --mode e2e
      # The store build (.output/chrome-mv3): the Agent Bridge store-build suite below runs it (T178).
      - name: Build (production, the store manifest)
        run: npm run build
      - name: Build the agent script
        run: npm run build:agent

      - name: Smoke suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-smoke.mjs

      # A/B: the same client-rendered fixture with the readiness gate off and on.
      # The control half must FAIL to render the late content. A suite where the
      # control passes is not testing the feature, it is testing the network.
      - name: SPA readiness suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-spa.mjs

      # #8 regression: the synthetic title heading must not duplicate the
      # page's own first heading. Case 6: a site's llms.txt or .md twin is never
      # requested (BL-49).
      - name: Title-dedupe suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-title-dedupe.mjs

      # #10 regression: URL drift during tab capture (replace-style and
      # push-style) must never kill the extraction or navigate the tab away.
      - name: URL-drift suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-url-drift.mjs

      # #11 regression: visible tab-panel content is never dropped — duplicate
      # panel ids resolve near the button, dedupe is full-content, toolbar and
      # feedback chrome is neither grouped as tabs nor clicked.
      - name: Tab-panels suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-tab-panels.mjs
      - name: Agent script suite (parity with the extension, CSP, Trusted Types, page tampering)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-agent.mjs
      - name: Tab-panels suite, run by the agent script (never-click list in the main world)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PAGE2AI_E2E_TARGET: agent
        run: xvfb-run -a node .e2e/e2e-tab-panels.mjs
      # MCP stdio -> WebSocket -> the popup's switch -> a background tab -> the
      # extractor -> back. The e2e build has site access: a user who allowed it.
      - name: Agent Bridge suite (extension + @page2ai/mcp over stdio)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-bridge.mjs
      # The same suite on the store build, which has no site access of its own (E-493: in T166
      # the e2e build's grant hid a bridge that worked on no page). No one answers the switch's
      # prompt here, so the extension must refuse before opening a tab and the server answer by
      # its own fetch. The granted path on this build: MANUAL_GRANT=1, run locally.
      - name: Agent Bridge suite, store build (no site access granted)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          EXT_PATH: .output/chrome-mv3
          EXPECT: fallback
        run: xvfb-run -a node .e2e/e2e-bridge.mjs

  cws-client:
    name: Chrome Web Store client (mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The release path runs for real only when a tag is cut, so it is tested here
    # on every push: a loopback server plays Google's token endpoint and the API V2
    # methods. No credentials, no network.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # shellcheck ships on GitHub's Ubuntu runner image.
      - name: Lint the store client
        run: shellcheck scripts/cws-v2.sh

      - name: Mock-API suite
        run: node scripts/cws-v2.test.mjs

  release-agent:
    name: Agent script release client (fake gh)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Same reason as cws-client: the agent-release job of publish-chrome.yml uploads for real only when a tag is
    # cut, so its script is tested here on every push, with a fake gh first on PATH. No token, no network.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint the release client
        run: shellcheck scripts/release-agent.sh

      - name: Fake-gh suite
        run: node scripts/release-agent.test.mjs
