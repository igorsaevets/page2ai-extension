name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Compile & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Build (Chrome MV3)
        run: npm run build
      # The agent script (BL-45 C): fails on an extension API, eval, a Trusted Types sink, a console call
      # or a new network call in the bundle (scripts/build-agent.mjs).
      - name: Build the agent script
        run: npm run build:agent

  e2e:
    name: End-to-end (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # puppeteer-core drives a real browser instead of bundling one, which is
      # the point: the extractor runs inside an actual extension context, not a
      # DOM emulation that would not reproduce injection or the service worker.
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Build (e2e mode)
        run: npx wxt build --mode e2e
      - name: Build the agent script
        run: npm run build:agent

      - name: Smoke suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-smoke.mjs

      # A/B: the same client-rendered fixture with the readiness gate off and on.
      # The control half must FAIL to render the late content. A suite where the
      # control passes is not testing the feature, it is testing the network.
      - name: SPA readiness suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-spa.mjs

      # #8 regression: the synthetic title heading must not duplicate the
      # page's own first heading, on the DOM-walk path and the official-md path.
      - name: Title-dedupe suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-title-dedupe.mjs

      # #10 regression: URL drift during tab capture (replace-style and
      # push-style) must never kill the extraction or navigate the tab away.
      - name: URL-drift suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-url-drift.mjs

      # #11 regression: visible tab-panel content is never dropped — duplicate
      # panel ids resolve near the button, dedupe is full-content, toolbar and
      # feedback chrome is neither grouped as tabs nor clicked.
      - name: Tab-panels suite
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-tab-panels.mjs
      - name: Agent script suite (parity with the extension, CSP, Trusted Types, page tampering)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run -a node .e2e/e2e-agent.mjs
      - name: Tab-panels suite, run by the agent script (never-click list in the main world)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PAGE2AI_E2E_TARGET: agent
        run: xvfb-run -a node .e2e/e2e-tab-panels.mjs

  cws-client:
    name: Chrome Web Store client (mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The release path runs for real only when a tag is cut, so it is tested here
    # on every push: a loopback server plays Google's token endpoint and the API V2
    # methods. No credentials, no network.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # shellcheck ships on GitHub's Ubuntu runner image.
      - name: Lint the store client
        run: shellcheck scripts/cws-v2.sh

      - name: Mock-API suite
        run: node scripts/cws-v2.test.mjs
