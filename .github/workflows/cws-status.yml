name: Chrome Web Store status

# Answers one question: is this extension actually live in the Chrome Web Store?
#
# It exists because that question was answered wrong twice in one week, both times
# by trusting a system that had no reason to disagree with us:
#
#   2026-07-23  the publish job was green while the API had returned
#               ITEM_NOT_UPDATABLE. The step carried continue-on-error, which makes
#               GitHub record conclusion: success for a step that failed.
#   2026-07-27  POST /items/{id}/publish returned {"status":["OK"]} and nothing was
#               published, because the item was still in review. An accepted request
#               is not a completed action.
#
# So the FIRST job here uses no credentials at all and asks Chrome's own update
# service, which serves the CRX to real browsers. If that says the item is unknown,
# the item is not live, whatever any dashboard or API says.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also submit the uploaded package for review (API V2 :publish). Only for an upload whose submit step failed; it does nothing useful while the item is already in review.'
        type: boolean
        default: false
  schedule:
    # Mondays 09:00 UTC. A heartbeat, not a monitor: nothing about the store
    # notifies us, and a store review can sit for weeks.
    - cron: '0 9 * * 1'

permissions:
  contents: read

env:
  # Public. This is the store ID, not a credential.
  ITEM_ID: dlpaaijcnbbmlfeohlphjpnbbcnomnno

jobs:
  live:
    name: Is it live (anonymous, no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Chrome's update service
        run: |
          set -euo pipefail

          # This is the endpoint a real Chrome asks for extension updates. It answers
          # for published items only, and it answers to anybody.
          XML=$(curl -sS --max-time 30 \
            "https://clients2.google.com/service/update2/crx?prodversion=140.0&acceptformat=crx2,crx3&x=id%3D${ITEM_ID}%26uc")

          echo "$XML"

          if grep -q 'status="ok"' <<<"$XML"; then
            VERSION=$(sed -n 's/.*version="\([^"]*\)".*/\1/p' <<<"$XML" | head -1)
            VERDICT="LIVE in the Chrome Web Store, version ${VERSION:-unknown}"
          elif grep -q 'error-unknownApplication' <<<"$XML"; then
            VERDICT="NOT LIVE. Google's update service has no published CRX for this ID."
          else
            VERDICT="UNDETERMINED. The update service answered something unexpected (see the XML above)."
          fi

          echo "$VERDICT"
          {
            echo "### Chrome Web Store"
            echo ""
            echo "**$VERDICT**"
            echo ""
            echo "Item: \`$ITEM_ID\` · checked $(date -u '+%Y-%m-%d %H:%M UTC') · no credentials used."
            echo ""
            echo "Reproduce with one command, no account needed:"
            echo '```'
            echo "curl -s 'https://clients2.google.com/service/update2/crx?prodversion=140.0&acceptformat=crx2,crx3&x=id%3D${ITEM_ID}%26uc'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Deliberately does not fail. A store review legitimately takes days to
          # weeks; a red run every Monday would train us to ignore this workflow.
          # Read the summary line.

  status:
    name: Query item status (needs store credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: live

    # Chrome Web Store API V2 through scripts/cws-v2.sh. API V1, which this job
    # called until 2026-10, stops answering on 2026-10-15.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read item status (API V2 fetchStatus, read-only)
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          # The secret must name the item this workflow is about. A wrong secret
          # would make every authenticated answer describe some other extension.
          if [ "$CWS_ITEM_ID" != "$ITEM_ID" ]; then
            echo "::error::Secret CHROME_EXTENSION_ID is not ${ITEM_ID}."
            exit 1
          fi
          bash scripts/cws-v2.sh status

      - name: Submit the uploaded package for review
        if: ${{ inputs.publish }}
        # The reply means the request was accepted, NOT that anything was published.
        # Confirm with the anonymous job above once review finishes.
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: bash scripts/cws-v2.sh publish
