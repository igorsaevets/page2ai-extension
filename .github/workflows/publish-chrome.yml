name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      reupload_tag:
        description: 'Empty = read-only preflight: build the zip and the agent script, check the store credentials and the release path, send nothing to the store or a release. Recovery only: a tag such as v1.4.0 uploads the Chrome zip attached to that GitHub Release and submits it for review.'
        type: string
        default: ''

concurrency:
  group: publish-chrome
  cancel-in-progress: false

permissions:
  contents: read

# GitHub's implicit shell for `run:` is `bash -e {0}` -- `-e` is on, `pipefail` is
# NOT. So `X=$(ls something | head -n 1)` succeeds with X empty when `ls` fails,
# because `head` is the last command in the pipe. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}`, which fails the step instead.
defaults:
  run:
    shell: bash

# Store calls go through scripts/cws-v2.sh: Chrome Web Store API V2 over plain curl,
# covered in CI by scripts/cws-v2.test.mjs. Until 2026-10 the upload step was the
# third-party action mnao305/chrome-extension-upload, which held all four store
# credentials and spoke API V1; Google stops serving V1 on 2026-10-15. If the script
# ever fails against the live API, the fallback is that action's V2 release v7.0.0
# (SHA f549d5d654694a7722d6abfa64c97409ad5e64c1), which needs a `publisher-id` input.

jobs:
  publish:
    name: Zip → CWS → GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        id: version
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: $TAG_REF"
          echo "Package: $PKG_VERSION"
          if [ "$TAG_REF" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_REF does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Zip Chrome extension
        run: npx wxt zip -b chrome

      - name: Locate zip artifact
        id: zip
        run: |
          ZIP_PATH=$(ls .output/*-chrome.zip | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No Chrome zip produced under .output/"
            exit 1
          fi
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Chrome zip: $ZIP_PATH ($(du -h "$ZIP_PATH" | cut -f1))"

      - name: Upload to Chrome Web Store and submit for review
        id: cws
        # continue-on-error is here so a store rejection does not cost us the GitHub
        # Release. On its own it also HIDES the rejection: GitHub records
        # conclusion=success for a step that failed, which is why v1.2.0 looked
        # published for four days while the API had answered ITEM_NOT_UPDATABLE.
        # The gate below turns the real outcome back into a red run.
        continue-on-error: true
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/cws-v2.sh upload "$ZIP_PATH" "$VERSION"
          bash scripts/cws-v2.sh publish

      - name: Create GitHub Release
        # SHA-pinned to v3.0.2 (2026-07-13). Runtime bumped to Node 24 — matches our setup.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
          body: |
            Chrome extension zip is attached to this release. ${{ steps.cws.outcome == 'success' && 'It has been submitted to the Chrome Web Store for review.' || 'Its Chrome Web Store submission FAILED; see the workflow run.' }}

            See [CHANGELOG.md](CHANGELOG.md) for the full list of changes.
          fail_on_unmatched_files: true

      - name: Record the store state after the submit
        if: ${{ always() && steps.cws.outcome != 'skipped' }}
        continue-on-error: true
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: bash scripts/cws-v2.sh status

      - name: Fail the run if the store rejected the upload
        if: ${{ steps.cws.outcome == 'failure' }}
        run: |
          echo "::error::The Chrome Web Store upload or submit failed. The GitHub Release was still created, but the store copy did NOT advance. Read Google's error in the 'Upload to Chrome Web Store' step, fix the cause, then run this workflow by hand with reupload_tag set to this tag."
          exit 1

  preflight:
    name: Preflight (read-only, uploads nothing)
    if: github.event_name == 'workflow_dispatch' && inputs.reupload_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zip Chrome extension
        run: npx wxt zip -b chrome

      - name: Show what a release would upload
        run: |
          shopt -s nullglob
          ZIPS=(.output/*-chrome.zip)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Expected one Chrome zip under .output/, found ${#ZIPS[@]}"
            exit 1
          fi
          echo "Chrome zip: ${ZIPS[0]} ($(du -h "${ZIPS[0]}" | cut -f1)), manifest version $(unzip -p "${ZIPS[0]}" manifest.json | jq -r .version)"

      - name: Check store credentials and publisher ID (API V2 fetchStatus)
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: bash scripts/cws-v2.sh status

  reupload:
    name: Re-upload a released zip
    if: github.event_name == 'workflow_dispatch' && inputs.reupload_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (for scripts/cws-v2.sh)
        uses: actions/checkout@v7

      - name: Download the Chrome zip attached to the release
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.reupload_tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::reupload_tag must look like v1.4.0"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-chrome.zip' --dir release-zip
          shopt -s nullglob
          ZIPS=(release-zip/*-chrome.zip)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one *-chrome.zip on release $TAG, found ${#ZIPS[@]}"
            exit 1
          fi
          VERSION=$(unzip -p "${ZIPS[0]}" manifest.json | jq -r .version)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::The zip on release $TAG carries manifest version $VERSION"
            exit 1
          fi
          echo "path=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          bash scripts/cws-v2.sh upload "$ZIP_PATH" "$VERSION"
          bash scripts/cws-v2.sh publish

      - name: Record the store state after the submit
        if: ${{ always() && steps.zip.outcome == 'success' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: bash scripts/cws-v2.sh status

  # The agent script (agent/README.md, BL-45 C) goes on the same GitHub Release as the Chrome zip: page2ai-agent.js,
  # page2ai-agent.fn.js and page2ai-agent.SHA256SUMS, built from the tag. `publish` needs neither job below, so
  # nothing here can delay, fail or cancel the store upload, and a red agent job leaves the store copy and the zip
  # as they are. Two jobs, so that `npm ci` (third-party install scripts) never runs where the token can write.
  # A run by hand without inputs runs both as the preflight of this path: everything but the upload.
  agent-build:
    name: Agent script (build and check)
    if: github.event_name == 'push' || inputs.reupload_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on an extension API, eval, a Trusted Types sink, a console call or a new network call in the bundle.
      - name: Build the agent script
        run: npm run build:agent

      - name: Check the build (checksums, the version and commit on line 1)
        run: bash scripts/release-agent.sh check .output/agent "$(jq -r .version package.json)+${GITHUB_SHA:0:7}"

      - name: Hand the files to agent-release
        uses: actions/upload-artifact@v7
        with:
          name: page2ai-agent
          path: .output/agent/
          if-no-files-found: error
          retention-days: 3

  agent-release:
    name: Agent script → GitHub Release
    needs: [publish, agent-build]
    # !cancelled() lets it run after a failed `publish` too: the store gate fails that job after the release exists,
    # and the release should still get its agent files. Without a release, attach fails and uploads nothing.
    if: ${{ !cancelled() && needs.agent-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout (for scripts/release-agent.sh)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Take the files agent-build made
        uses: actions/download-artifact@v8
        with:
          name: page2ai-agent
          path: agent-files

      - name: Check them after the hand-off
        run: bash scripts/release-agent.sh check agent-files "$(jq -r .version package.json)+${GITHUB_SHA:0:7}"

      - name: Rehearse on the latest release (read-only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-agent.sh plan

      # Uploads only what the release lacks, never replaces a published file, then downloads all three back
      # and checks them there. If this job fails, re-run it alone: `gh run rerun <run-id> --job <job-id>`.
      - name: Attach them to the release and check them there
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-agent.sh attach "$TAG" agent-files "${TAG#v}+${GITHUB_SHA:0:7}"
